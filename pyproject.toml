[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-rpr-oauth"
version = "1.1.1"
description = "Flask OAuth 2.0 / OpenID Connect extensie voor Roleplay Reality Auth Server"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Roleplay Reality", email = "support@roleplayreality.nl"}
]
keywords = ["flask", "oauth", "oauth2", "openid-connect", "authentication", "authorization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: Flask",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Flask>=2.0.0",
    "Authlib>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
redis = [
    "redis>=4.0.0",
    "Flask-Session>=0.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "bandit>=1.7.0",
    "build>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/rpr-development/flask-rpr-oauth"
Documentation = "https://github.com/rpr-development/flask-rpr-oauth/blob/main/README.md"
Repository = "https://github.com/rpr-development/flask-rpr-oauth"
"Bug Tracker" = "https://github.com/rpr-development/flask-rpr-oauth/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=flask_rpr_oauth",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["flask_rpr_oauth"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests", "authlib.*"]
ignore_missing_imports = true
