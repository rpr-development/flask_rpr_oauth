name: Rewrite Commit Author

on:
  pull_request:
    types: [closed]
    branches: [main, legacy]

jobs:
  rewrite-author:
    # Alleen uitvoeren als de PR gemerged is (niet alleen gesloten)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Volledige history nodig
          token: ${{ secrets.PAT_TOKEN }}  # Personal Access Token met push rechten
      
      - name: Configure Git
        run: |
          git config user.name "Roleplay Reality"
          git config user.email "development@roleplayreality.nl"
      
      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo
      
      - name: Get number of commits in PR
        id: pr-commits
        run: |
          echo "COUNT=${{ github.event.pull_request.commits }}" >> $GITHUB_OUTPUT
      
      - name: Rewrite PR commits author
        run: |
          COMMIT_COUNT=${{ steps.pr-commits.outputs.COUNT }}
          
          # Gebruik git-filter-repo voor veiligere herschrijving
          # Herschrijf de laatste N commits (de commits van de PR)
          git filter-repo --force --commit-callback '
            commit.author_name = b"Roleplay Reality"
            commit.author_email = b"development@roleplayreality.nl"
            commit.committer_name = b"Roleplay Reality"
            commit.committer_email = b"development@roleplayreality.nl"
          ' --refs HEAD~${COMMIT_COUNT}..HEAD
      
      - name: Force push changes
        run: |
          BRANCH="${{ github.event.pull_request.base.ref }}"
          git push --force origin $BRANCH
